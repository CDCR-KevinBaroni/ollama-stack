# Drop-in override for /etc/systemd/system/ollama.service.d/override.conf
#
# Installed by install.sh. Layers on top of the base ollama.service that the
# official installer (curl https://ollama.com/install.sh | sh) creates.
# Future Ollama installer upgrades replace the base unit; this file is left
# alone so the tuning survives.
#
# Tuned for: 13th Gen Intel Core i7-1360P (4 P-cores + 8 E-cores, no GPU),
# 64 GB RAM, 2-5 concurrent users. See ../README.md for rationale.

[Service]
# Listen only on loopback. open-webui.service connects via http://127.0.0.1:11434.
# If you need LAN access, change to 0.0.0.0:11434 and open the firewall.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Model store on WSL2-native ext4, not /mnt/d/ (9P passthrough is slow for mmap).
# install.sh creates this directory and chowns it to the ollama user.
Environment="OLLAMA_MODELS=/var/lib/ollama/models"

# NOTE: there is no OLLAMA_NUM_THREADS env var -- Ollama auto-detects thread
# count from the active CPU set, so CPUAffinity=0-7 below also caps threads at
# 8. To set a per-request thread count, use the API's options.num_thread or a
# Modelfile `PARAMETER num_thread N`. The tune-threads.sh script in this folder
# can sweep that per-request value if you want to validate empirically.

# Concurrent in-flight requests. With NUM_THREADS=4 and 4 P-cores, two parallel
# requests fully saturate the P-cores. Higher values trade per-request latency
# for total throughput at this user count.
Environment="OLLAMA_NUM_PARALLEL=2"

# Models kept resident in RAM. Three slots: main chat model (mistral:7b),
# reasoning model (deepseek-r1:8b), and task model (llama3.2:3b for title /
# tag / query-rewrite calls Open WebUI fires per chat). With only 2 slots,
# a task call against llama3.2:3b would evict mistral, forcing a reload on
# the next user message -- noticed during 2026-05-27 diagnosis.
Environment="OLLAMA_MAX_LOADED_MODELS=3"

# How long an idle model stays in RAM before being unloaded. 30m reduces reload
# churn for a 2-5 user team without pinning models forever.
Environment="OLLAMA_KEEP_ALIVE=30m"

# Quantized KV cache: ~75% RAM savings vs f16 with negligible quality impact.
# Requires OLLAMA_FLASH_ATTENTION=true (below).
# Allowed values: q4_0, q4_1, q5_0, q5_1, q8_0, f16
Environment="OLLAMA_KV_CACHE_TYPE=q4_0"

# Required for quantized KV cache. Also a small win on its own.
Environment="OLLAMA_FLASH_ATTENTION=true"

# Quiet logs in steady state; flip to 1 when debugging.
Environment="OLLAMA_DEBUG=0"

# Pin inference threads to the four P-cores and their HT siblings.
# Assumes Linux numbers P-core logical CPUs as 0-7 on this hardware -- verify
# with `lscpu --extended` and adjust if your topology differs.
CPUAffinity=0-7
