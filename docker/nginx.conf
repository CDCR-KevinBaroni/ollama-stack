server {
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    chunked_transfer_encoding on;

    listen 80;
    server_name openwebui.local;

    location / {
        proxy_pass http://openwebui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
