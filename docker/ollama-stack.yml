services:
  ollama:
    image: ollama/ollama:latest
    # networks:
    #   - ollama_net
    ports:
      # Unauthenticated: loopback only (FU1).
      - "0.0.0.0:11434:11434"
      - "0.0.0.0:51434:11434"
    # OLLAMA_KV_CACHE_TYPE values q4_0, q4_1, q5_0, q5_1, q8_0, f16
    environment:
      OLLAMA_CONTEXT_LENGTH: 32768
      OLLAMA_DEBUG: 0
      OLLAMA_FLASH_ATTENTION: true
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 1440m
      OLLAMA_KV_CACHE_TYPE: q4_0
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_NO_CLOUD: true
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_NUM_THREADS: 16
      OLLAMA_ORIGINS: "*"
      OLLAMA_PORT: 11434
      TZ: America/Los_Angeles
    # This preloads multiple models sets the default model in the first "ollama run" statement
    entrypoint: ["/bin/bash", "-c"]
    command: [
        "/bin/ollama serve & \
        sleep 5 && \
        /bin/ollama run gpt-oss:20b  --keepalive 1440m >/dev/null 2>&1 & \
        wait",
      ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist Ollama state
      - /var/ollama_stack/ollama//data:/root/.ollama
      # Persistent models
      - /var/ollama_stack/ollama//models:/root/.ollama/models
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "8.0"
          memory: 32G
        reservations:
          cpus: "2.0"
          memory: 16G

